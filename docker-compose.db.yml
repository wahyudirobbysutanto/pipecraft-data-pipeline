services:
  mysql_source:
    image: mysql:8.0
    container_name: pipecraft_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQLDB_PASSWORD}
      MYSQL_DATABASE: bizpulse_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Data/mysql_initial.sql:/docker-entrypoint-initdb.d/01_mysql_initial.sql:ro
    networks:
      - pipecraft_net

  postgres_dwh:
    image: postgres:15
    container_name: pipecraft_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bizpulse_dwh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Data/initial.sql:/docker-entrypoint-initdb.d/01_initial.sql:ro
    networks:
      - pipecraft_net

volumes:
  mysql_data:
  postgres_data:

networks:
  pipecraft_net:
    external: true